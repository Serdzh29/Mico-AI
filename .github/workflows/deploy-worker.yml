name: Mico Cloud gateway (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["cloud/src/**", "cloud/wrangler.jsonc", "cloud/tests/**", "cloud/public/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверки шлюза
        run: node cloud/tests/test_worker.mjs
      - name: Деплой в Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          command: deploy
